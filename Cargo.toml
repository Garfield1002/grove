[workspace]
resolver = "3"
members = ["crates/grove-core", "crates/grove"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
grove-core = { path = "crates/grove-core" }
eframe = { version = "0.32", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.32"
# Only to decode the backdrop PNG at first paint. No codecs beyond png, and
# no image processing: the art is drawn as a tinted texture.
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.25"
# Native file picker. On Wayland this is the xdg-desktop-portal dialog, i.e.
# the compositor's own picker — no window tricks of our own. The portal client
# (`ashpd`) needs an async executor internally; Grove's own concurrency stays
# threads + mpsc, and the picker is called blocking from the worker thread.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "async-std"] }
thiserror = "2"
shell-words = "1"
tempfile = "3"
