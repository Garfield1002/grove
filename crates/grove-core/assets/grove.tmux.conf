# Grove-managed tmux settings — DO NOT EDIT.
#
# Grove rewrites this file on every start from the copy shipped inside the
# binary. Any change you make here is lost. Put your own settings in
# tmux.conf beside it, which Grove writes once and never touches again;
# it sources this file first, so anything you set there wins.

# --- Status detection -------------------------------------------------
# Grove reads monitor-activity/monitor-bell flags to decide whether a
# worktree is working or wants attention. Without these every session
# looks idle. exit-empty keeps the private server alive once its last
# session closes, so Grove does not have to restart it constantly.
set -g monitor-bell on
set -g monitor-activity on
set -s exit-empty off

# --- Terminal ---------------------------------------------------------
# What applications inside a pane see as $TERM. tmux-256color is the
# terminfo entry describing tmux itself, rather than lying about being
# some other terminal.
set -g default-terminal "tmux-256color"

# Let an application inside a pane send escape sequences straight through
# to the outer terminal: desktop notifications (OSC 9/777), progress
# reporting, inline images. Agents use these to signal that they want
# attention, so tmux must not swallow them.
set -g allow-passthrough on

# --- Scrollback -------------------------------------------------------
# tmux owns the scrollback, because it holds the alternate screen and the
# outer terminal has none of its own left to scroll. The default 2000 is
# short for a long agent session.
set -g history-limit 100000

# The wheel scrolls that scrollback, and selects and resizes panes.
set -g mouse on

# --- Modified keys ----------------------------------------------------
# Shift+Enter, Ctrl+Enter and similar only reach the pane when extended
# keys are on. `on` forwards them to applications that ask for the mode —
# agents and modern editors do — while leaving everything else alone;
# `always` would force them on programs that cannot decode them.
set -g extended-keys always

# The encoding for those keys. csi-u is what the kitty keyboard protocol
# uses (`CSI 13;2u`); tmux's default `xterm` format emits modifyOtherKeys
# (`CSI 27;2;13~`) instead, which agents and most editors do not decode.
# This was the reason Shift+Enter arrived as a plain Enter.
set -g extended-keys-format csi-u

# Capabilities of the *outer* terminal. Named exactly rather than with a
# `*` glob, so a terminal that lacks these is never told it has them.
# This is read when a client attaches: a change here only affects
# terminals opened afterwards, never one already running.
set -as terminal-features 'xterm-kitty:extkeys:RGB'
set -as terminal-features 'xterm-ghostty:extkeys:RGB'
set -as terminal-features 'xterm-256color:extkeys:RGB'
set -as terminal-features 'alacritty:extkeys:RGB'
set -as terminal-features 'foot:extkeys:RGB'