# Grove-managed tmux settings — DO NOT EDIT.
#
# Grove rewrites this file on every start from the copy shipped inside the
# binary. Any change you make here is lost. Put your own settings in
# tmux.conf beside it, which Grove writes once and never touches again;
# it sources this file first, so anything you set there wins.

# --- Status detection -------------------------------------------------
# Grove reads monitor-activity/monitor-bell flags to decide whether a
# worktree is working or wants attention. Without these every session
# looks idle. exit-empty keeps the private server alive once its last
# session closes, so Grove does not have to restart it constantly.
set -g monitor-bell on
set -g monitor-activity on
set -s exit-empty off

# --- Terminal ---------------------------------------------------------
# What applications inside a pane see as $TERM. tmux-256color is the
# terminfo entry describing tmux itself, rather than lying about being
# some other terminal.
set -g default-terminal "tmux-256color"

# Let an application inside a pane send escape sequences straight through
# to the outer terminal: desktop notifications (OSC 9/777), progress
# reporting, inline images. Agents use these to signal that they want
# attention, so tmux must not swallow them.
set -g allow-passthrough on

# --- Chrome -----------------------------------------------------------
# No status bar. It is tmux's own UI — session name, window tabs, clock —
# and Grove is already that UI: the tree lists every session and every
# window in it. Two of them is one too many, and the pane is a terminal
# the user is reading, not a frame to decorate. Put `set -g status on` in
# tmux.conf to get it back; that file is sourced after this one.
set -g status off

# --- Scrollback -------------------------------------------------------
# tmux owns the scrollback, because it holds the alternate screen and the
# outer terminal has none of its own left to scroll. The default 2000 is
# short for a long agent session.
set -g history-limit 100000

# The wheel scrolls that scrollback, and selects and resizes panes.
set -g mouse on

# And a scrollbar to show where in it you are. The outer terminal cannot
# draw one for the same reason it cannot scroll — kitty has none at all,
# and the terminals that do are looking at the alternate screen — so the
# scrollbar has to come from the side that owns the buffer.
#
# Scrollbars arrived in tmux 3.6, and an option tmux does not know is an
# error it prints at every attach. Guarded, so an older tmux quietly goes
# without rather than complaining about a line it cannot use.
#
# A window option, hence `-wg`. `on` keeps it visible and narrows the pane
# by its width; `modal` shows it only in copy mode, which costs no columns
# but is not there when you want to know whether there is more above.
%if #{>=:#{version},3.6}
set -wg pane-scrollbars on
set -wg pane-scrollbars-position right
# `fg` is the thumb, `bg` the trough. Default is a solid black column with
# a white thumb, which reads as a hard border; `bg=default` lets the
# trough be the terminal's own background and `pad=1` keeps the text off
# it, so what is left is the thumb.
set -wg pane-scrollbars-style 'bg=default,fg=brightblack,width=1,pad=1'
%endif

# --- Modified keys ----------------------------------------------------
# Shift+Enter, Ctrl+Enter and similar only reach the pane when extended
# keys are on. `on` forwards them to applications that ask for the mode —
# agents and modern editors do — while leaving everything else alone;
# `always` would force them on programs that cannot decode them.
set -g extended-keys always

# The encoding for those keys. csi-u is what the kitty keyboard protocol
# uses (`CSI 13;2u`); tmux's default `xterm` format emits modifyOtherKeys
# (`CSI 27;2;13~`) instead, which agents and most editors do not decode.
# This was the reason Shift+Enter arrived as a plain Enter.
set -g extended-keys-format csi-u

# Capabilities of the *outer* terminal. Named exactly rather than with a
# `*` glob, so a terminal that lacks these is never told it has them.
# This is read when a client attaches: a change here only affects
# terminals opened afterwards, never one already running.
set -as terminal-features 'xterm-kitty:extkeys:RGB'
set -as terminal-features 'xterm-ghostty:extkeys:RGB'
set -as terminal-features 'xterm-256color:extkeys:RGB'
set -as terminal-features 'alacritty:extkeys:RGB'
set -as terminal-features 'foot:extkeys:RGB'

# --- Agent colour depth -----------------------------------------------
# Claude Code caps itself to the 256-colour palette whenever `$TMUX` is
# set, regardless of TERM, COLORTERM or terminfo — an old precaution from
# when tmux really did mangle 24-bit colour. Inside Grove that is always
# wrong: the pane negotiates RGB with the outer terminal above, so the
# full range is available and the cap only rounds every colour to its
# nearest palette entry. Claude's orange lands on xterm 173 and comes out
# visibly paler.
#
# This opts back in. `FORCE_COLOR` does not override the cap and unsetting
# `$TMUX` would be worse than the problem — a bare `tmux` run inside the
# pane would then find the user's default server instead of Grove's
# private one.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1